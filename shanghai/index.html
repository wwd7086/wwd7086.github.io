<style>
  :root { --ink: #f3efe8; --dim: rgba(243,239,232,.62); --accent: #8ec5f0; --line: rgba(243,239,232,.35); --halo: rgba(8,9,14,.45); --panel: rgba(8,9,14,.55); --shadow: 0 1px 2px rgba(0,0,0,.6), 0 0 18px rgba(0,0,0,.35); --scrim: rgba(6,6,10,.38); --scrim-b: rgba(6,6,10,.55); --mono: 'IBM Plex Mono', ui-monospace, monospace; --serif: 'Newsreader', Georgia, serif; --cn: 'Noto Serif SC', 'Songti SC', serif; }
  body.day { --ink: #1b1916; --dim: rgba(27,25,22,.68); --accent: #1a5a9a; --line: rgba(27,25,22,.4); --halo: rgba(243,239,232,.6); --panel: rgba(243,239,232,.66); --shadow: 0 1px 2px rgba(255,255,255,.55), 0 0 16px rgba(255,255,255,.45); --scrim: rgba(240,236,228,.42); --scrim-b: rgba(240,236,228,.6); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07070a; overflow: hidden; color: var(--ink); font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); } a:hover { color: var(--ink); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #c:active { cursor: grabbing; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: var(--ink); text-shadow: var(--shadow); transition: opacity .5s, color .6s, text-shadow .6s; }
  #hud.hidden { opacity: 0; }
  #hud::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, var(--scrim), transparent 30%, transparent 68%, var(--scrim)), linear-gradient(to top, var(--scrim-b), transparent 32%); pointer-events: none; transition: background .6s; }

  #hud button { color: var(--ink); font: inherit; cursor: pointer; transition: color .3s, border-color .3s, background .3s; }
  #hud button:focus-visible, #hud input:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }

  #clockLabel { display: block; margin-top: 8px; color: var(--dim); }

  .chap { background: none; border: 0; padding: 2px 0; color: var(--dim); display: flex; gap: 14px; align-items: baseline; white-space: nowrap; text-shadow: inherit; }

  .chap.on .nm i { color: var(--accent); opacity: 1; }
  #tourBtn { margin-top: 14px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }

  #capTitle { font-family: var(--cn); font-weight: 300; font-size: 30px; letter-spacing: .06em; }

  #helpBtn { font-family: var(--mono); font-size: 13px; }
  #play:hover, #helpBtn:hover, #helpBtn[aria-expanded="true"] { border-color: var(--ink); }
  #track { position: relative; flex: 1; height: 34px; }

  #scrub { position: relative; -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; cursor: pointer; }
  #scrub::-webkit-slider-runnable-track { height: 3px; background: transparent; }

  .ticks { position: absolute; left: 0; right: 0; top: 24px; display: flex; justify-content: space-between; color: var(--dim); font-family: var(--mono); font-size: 10px; letter-spacing: .12em; pointer-events: none; }
  .ticks span { position: absolute; transform: translateX(-50%); }
  #keys { position: absolute; right: 36px; bottom: 84px; padding: 12px 16px; background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 4px; display: grid; grid-template-columns: auto auto; gap: 7px 16px; align-items: baseline; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--dim); opacity: 0; transform: translateY(6px); transition: opacity .35s, transform .35s, background .6s, border-color .6s; pointer-events: none !important; }
  #keys.on { opacity: 1; transform: none; pointer-events: auto !important; }
  #keys b { font-weight: 500; color: var(--accent); text-transform: uppercase; letter-spacing: .12em; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity .42s; pointer-events: none; }
  #fade.on { opacity: 1; }
  #loading { position: fixed; inset: 0; background: #07070a; color: #f3efe8; display: grid; place-items: center; z-index: 10; transition: opacity 1.4s; }
  #loading.off { opacity: 0; pointer-events: none; }
  #loading .big { font-family: var(--cn); font-weight: 300; font-size: 64px; letter-spacing: .2em; }
  #loading .sub { margin-top: 14px; text-align: center; color: rgba(243,239,232,.6); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  /* site addition: the way home, set like the hint line */
  #home { display: inline-block; margin-top: 14px; color: var(--dim); text-decoration: none; }
  #home:hover { color: var(--ink); }
  @media (max-width: 720px) {
    #title { left: 20px; top: 20px; } #title .cn { font-size: 34px; } #title .en { font-size: 16px; } #title .hint, #compass { display: none; }

    #chapters::-webkit-scrollbar { display: none; }
    .chap { flex: none; } .chap .nm i { display: none; } #tourBtn { margin: 0; flex: none; }
    #caption, #card { left: 20px; right: 20px; bottom: 140px; max-width: none; } #capTitle { font-size: 22px; } #capTitle i { font-size: 18px; } #capText { font-size: 14px; }
    #cardCn { font-size: 22px; } #cardEn { font-size: 16px; } #cardNote { font-size: 14px; }
    #timeline { left: 20px; right: 20px; bottom: 22px; } #helpBtn, #keys { display: none; }
  }
