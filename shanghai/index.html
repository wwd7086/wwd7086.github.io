<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const C = (h) => new THREE.Color(h);
let seed = 1188;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ---------- materials ----------
const M = {};
function mat(name, color, opts = {}) { const m = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.15, ...opts }); m.name = name; M[name] = m; return m; }
mat('glass_blue',  0x7fa4bd, { roughness: 0.24, metalness: 0.35, emissive: 0x3a5c86, emissiveIntensity: 0 });
mat('glass_teal',  0x74a09c, { roughness: 0.28, metalness: 0.32, emissive: 0x2f6a5e, emissiveIntensity: 0 });
mat('glass_dark',  0x46586b, { roughness: 0.3,  metalness: 0.38, emissive: 0x46628c, emissiveIntensity: 0 });
mat('glass_champagne', 0xb3a98f, { roughness: 0.3, metalness: 0.35, emissive: 0x9a6f38, emissiveIntensity: 0 });
mat('concrete',    0xb9b2a4, { roughness: 0.85, metalness: 0.04 });
mat('steel',       0xd2d6da, { roughness: 0.38, metalness: 0.4 });
mat('pearl_red',   0xa64a5a, { roughness: 0.4, metalness: 0.2, emissive: 0xff5f86, emissiveIntensity: 0 });
mat('pearl_concrete', 0xc5bfb2, { roughness: 0.8 });
mat('band_dark',   0x18212c, { roughness: 0.45, metalness: 0.3 });
mat('window_warm', 0x1b2531, { roughness: 0.4, metalness: 0.3, emissive: 0xffb45c, emissiveIntensity: 0 });
mat('window_cool', 0x1c2836, { roughness: 0.4, metalness: 0.3, emissive: 0xcfe4ff, emissiveIntensity: 0 });
mat('bund_stone',  0xc9b795, { roughness: 0.9, metalness: 0.02, emissive: 0xffbe78, emissiveIntensity: 0 });
mat('bund_window', 0x2a2318, { roughness: 0.5, emissive: 0xffc98a, emissiveIntensity: 0 });
mat('roof_copper', 0x4e7d6a, { roughness: 0.5, metalness: 0.3 });
mat('clock_face',  0xf2ead8, { roughness: 0.5, emissive: 0xfff1c8, emissiveIntensity: 0 });
mat('water',       0x5f7a72, { roughness: 0.14, metalness: 0.25, emissive: 0xe07a4e, emissiveIntensity: 0 });
mat('base_stone',  0x97917f, { roughness: 0.95 });
mat('road',        0x2b2723, { roughness: 0.95, emissive: 0xff9848, emissiveIntensity: 0 });
mat('grass',       0x5d7a4a, { roughness: 0.95 });
mat('tree_green',  0x4d6b40, { roughness: 0.9 });
mat('bark',        0x5c4632, { roughness: 0.9 });
mat('boat_white',  0xe8e4da, { roughness: 0.6 });
mat('crane_red',   0xc04a32, { roughness: 0.6 });
mat('beacon_red',  0x8a2020, { roughness: 0.5, emissive: 0xff3b30, emissiveIntensity: 0.3 });
mat('bridge_steel', 0x8b9299, { roughness: 0.45, metalness: 0.35, emissive: 0xffcf8a, emissiveIntensity: 0 });
mat('asphalt_old', 0x8b8578, { roughness: 0.95 });
mat('brick_gray',  0x857b6e, { roughness: 0.92 });
mat('brick_warm',  0x96725a, { roughness: 0.92 });
mat('roof_tile',   0x5b544e, { roughness: 0.9 });
mat('tile_beige',  0xb5ac97, { roughness: 0.88 });
mat('deco_brown',  0x6e5643, { roughness: 0.85 });
mat('signal_red',  0xb23a2c, { roughness: 0.7 });
mat('signal_white', 0xe9e3d3, { roughness: 0.7 });
mat('ferry_orange', 0xd97a30, { roughness: 0.6 });
mat('barge_rust',  0x5f4a3c, { roughness: 0.9 });
mat('sand',        0xa4906c, { roughness: 1 });
mat('led_screen',  0x1c0c10, { roughness: 0.5, emissive: 0xff2942, emissiveIntensity: 0.04 });
mat('lamp_globe',  0xf4ecd6, { roughness: 0.4, emissive: 0xffe9b0, emissiveIntensity: 0 });
mat('crown_gold',  0xb39a6a, { roughness: 0.4, metalness: 0.3, emissive: 0xffd27a, emissiveIntensity: 0 });
mat('cloth_blue',  0x4a6a8a, { roughness: 0.9 });
mat('cloth_red',   0xa04438, { roughness: 0.9 });
mat('cloth_white', 0xddd8cc, { roughness: 0.9 });
const glassPool = [M.glass_blue, M.glass_teal, M.glass_dark, M.glass_champagne, M.concrete];

// ---------- helpers ----------
const city = new THREE.Group();
city.name = 'shanghai_skyscape';
function box(parent, name, w, h, d, m, x, y, z, ry = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.name = name; mesh.position.set(x, y, z); mesh.rotation.y = ry;
  parent.add(mesh); return mesh;
}
function cyl(parent, name, rt, rb, h, m, x, y, z, seg = 28) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.name = name; mesh.position.set(x, y, z); parent.add(mesh); return mesh;
}
function sph(parent, name, r, m, x, y, z, ws = 28, hs = 20) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, ws, hs), m);
  mesh.name = name; mesh.position.set(x, y, z); parent.add(mesh); return mesh;
}
const beacons = [];
function beacon(parent, x, y, z) {
  const b = sph(parent, 'beacon_' + beacons.length, 1.8, M.beacon_red, x, y, z, 12, 10);
  beacons.push(b); return b;
}
// window batcher: thousands of individual panes merged into one mesh per material
const winBatch = { warm: [], cool: [], dark: [], bund: [] };
function addWin(key, w, h, d, x, y, z, ry, g) { winBatch[key].push({ w, h, d, x, y, z, ry: ry || 0, g }); }
function gridFaces(g, key0, w, d, h, o = {}) {
  const fp = o.fp ?? 7.5, y0 = o.y0 ?? 9, y1 = o.y1 ?? h - 5, px = o.px ?? 5.4;
  const pw = o.pw ?? 3.3, ph = o.ph ?? 3.2, pd = 0.5, out = o.out ?? 0.2;
  const rot = o.ry || 0, cr = Math.cos(rot), sr = Math.sin(rot);
  const pWarm = o.warm ?? 0.3, pCool = o.cool ?? 0.22;
  const pick = () => { const r = rand(); return r < pWarm ? 'warm' : r < pWarm + pCool ? 'cool' : key0; };
  const put = (key, a, b, c, x, y, z) => addWin(key, a, b, c, x * cr + z * sr, y, -x * sr + z * cr, rot, g);
  for (let y = y0; y < y1; y += fp) {
    const nx = Math.max(1, Math.floor((w - 3) / px)), nz = Math.max(1, Math.floor((d - 3) / px));
    for (let k = 0; k < nx; k++) {
      const x = (k - (nx - 1) / 2) * px;
      put(pick(), pw, ph, pd, x, y, d / 2 + out); put(pick(), pw, ph, pd, x, y, -(d / 2 + out));
    }
    if (o.sides === false) continue;
    for (let k = 0; k < nz; k++) {
      const z = (k - (nz - 1) / 2) * px;
      put(pick(), pd, ph, pw, w / 2 + out, y, z); put(pick(), pd, ph, pw, -(w / 2 + out), y, z);
    }
  }
}
function roofKit(g, name, w, d, h) {
  box(g, name + '_mech', w * 0.36, 6, d * 0.42, M.concrete, -w * 0.14, h + 3, -d * 0.1);
  if (rand() < 0.55) cyl(g, name + '_tank', 2.6, 2.6, 4.6, M.signal_white, w * 0.24, h + 2.3, d * 0.2, 12);
  else box(g, name + '_ac', 5, 2.4, 4, M.steel, w * 0.24, h + 1.2, d * 0.2);
  box(g, name + '_ac2', 3.4, 2, 3, M.steel, w * 0.02, h + 1, d * 0.3);
  box(g, name + '_para_n', w + 1, 1.5, 1, M.concrete, 0, h + 0.75, -d / 2);
  box(g, name + '_para_s', w + 1, 1.5, 1, M.concrete, 0, h + 0.75, d / 2);
  box(g, name + '_para_e', 1, 1.5, d + 1, M.concrete, w / 2, h + 0.75, 0);
  box(g, name + '_para_w', 1, 1.5, d + 1, M.concrete, -w / 2, h + 0.75, 0);
  if (rand() < 0.35) cyl(g, name + '_mast', 0.25, 0.4, 13, M.steel, w * 0.12, h + 6.5, -d * 0.15, 6);
}

// ---------- ground, river, streets ----------
// the Huangpu bends around Lujiazui: banks are arcs about a center inside Pudong
const XC = -30, ZC = 385, RIV_IN = 535, RIV_OUT = 665;
const zArc = (R, x) => ZC - Math.sqrt(R * R - (x - XC) * (x - XC));
const polarPos = (R, psi) => ({ x: XC + R * Math.sin(psi), z: ZC - R * Math.cos(psi) });
const psiAt = (R, x) => Math.asin((x - XC) / R);
function arcBand(name, R0, R1, m, depth, y, x0 = -370, x1 = 370) {
  const s = new THREE.Shape(), n = 56;
  s.moveTo(x0, -zArc(R0, x0));
  for (let i = 1; i <= n; i++) s.lineTo(x0 + (x1 - x0) * i / n, -zArc(R0, x0 + (x1 - x0) * i / n));
  for (let i = 0; i <= n; i++) s.lineTo(x1 + (x0 - x1) * i / n, -zArc(R1, x1 + (x0 - x1) * i / n));
  s.closePath();
  const mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false }), m);
  mesh.name = name; mesh.rotation.x = -Math.PI / 2; mesh.position.y = y; city.add(mesh); return mesh;
}
const podS = new THREE.Shape(); podS.moveTo(-370, -190); podS.lineTo(370, -190);
for (let i = 0; i <= 56; i++) podS.lineTo(370 - 740 * i / 56, -zArc(RIV_IN, 370 - 740 * i / 56));
podS.closePath();
const podM = new THREE.Mesh(new THREE.ExtrudeGeometry(podS, { depth: 8, bevelEnabled: false }), M.base_stone);
podM.name = 'podium'; podM.rotation.x = -Math.PI / 2; podM.position.y = -8; city.add(podM);          // Pudong side: z -150..190
arcBand('huangpu_river', RIV_IN, RIV_OUT, M.water, 2, -2.6);     // river: z -280..-150
arcBand('bund_quay', RIV_OUT, 725, M.base_stone, 6, -6);      // Bund: z -340..-280, east of Suzhou Creek
arcBand('puxi_ground', 725, 825, M.asphalt_old, 6, -6);  // old Puxi hinterland: z -440..-340
box(city, 'suzhou_creek', 170, 2, 40, M.water, -310, -0.92, -305, Math.PI / 2 + 0.3853);
box(city, 'avenue_a', 700, 0.6, 12, M.road, 0, 0.31, 105);
arcBand('riverside_drive', 517, 529, M.road, 0.6, 0.01);
box(city, 'street_a', 12, 0.6, 294, M.road, -215, 0.32, 42);
box(city, 'street_b', 12, 0.6, 327, M.road, -25, 0.32, 25);
box(city, 'street_c', 12, 0.6, 251, M.road, 245, 0.32, 63);
arcBand('bund_promenade_w', 667, 677, M.road, 0.7, -0.3, -370, -301);
arcBand('bund_promenade', 667, 677, M.road, 0.7, -0.3, -264, 370);
arcBand('zhongshan_road_w', 727, 741, M.road, 0.7, -0.3, -370, -325);
arcBand('zhongshan_road', 727, 741, M.road, 0.7, -0.3, -287, 370);

// ---------- Oriental Pearl-style broadcast tower ----------
const pearl = new THREE.Group(); pearl.name = 'pearl_tower'; pearl.position.set(-150, 0, -88); city.add(pearl);
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * Math.PI * 2 + 0.5;
  const leg = cyl(pearl, 'pearl_leg_' + i, 3.2, 4.4, 122, M.pearl_concrete, Math.cos(a) * 25, 55, Math.sin(a) * 25, 20);
  leg.rotation.set(-Math.sin(a) * 0.35, 0, Math.cos(a) * 0.35);
  sph(pearl, 'pearl_base_sphere_' + i, 6.5, M.pearl_red, Math.cos(a) * 11, 6, Math.sin(a) * 11, 22, 16);
  cyl(pearl, 'pearl_column_' + i, 2.5, 2.5, 230, M.pearl_concrete, Math.cos(a) * 7.5, 139, Math.sin(a) * 7.5, 16);
}
sph(pearl, 'pearl_lower_sphere', 28, M.pearl_red, 0, 118, 0, 40, 28);
const collar = new THREE.Mesh(new THREE.TorusGeometry(28.5, 1.1, 12, 44), M.steel);
collar.name = 'pearl_collar'; collar.rotation.x = Math.PI / 2; collar.position.set(0, 118, 0); pearl.add(collar);
sph(pearl, 'pearl_mid_a', 5.5, M.pearl_red, 0, 170, 0, 18, 14);
sph(pearl, 'pearl_mid_b', 5.5, M.pearl_red, 0, 196, 0, 18, 14);
sph(pearl, 'pearl_mid_c', 5.5, M.pearl_red, 0, 222, 0, 18, 14);
sph(pearl, 'pearl_upper_sphere', 15.5, M.pearl_red, 0, 256, 0, 32, 24);
cyl(pearl, 'pearl_antenna', 0.9, 2.4, 150, M.steel, 0, 346, 0, 12);
beacon(pearl, 0, 424, 0);
// elevated circular walkway ringing the tower base
// grounded base: plaza disc, entrance drum, ring walkway on columns
cyl(pearl, 'pearl_plaza', 44, 47, 2, M.base_stone, 0, 1, 0, 44);
cyl(pearl, 'pearl_hall', 13, 15, 7, M.pearl_concrete, 0, 3.5, 0, 24);
const ring = new THREE.Mesh(new THREE.TorusGeometry(34, 2, 12, 60), M.concrete);
ring.name = 'pearl_ring_walkway'; ring.rotation.x = Math.PI / 2; ring.position.set(0, 9, 0); pearl.add(ring);
for (let i = 0; i < 10; i++) {
  const ra = i / 10 * Math.PI * 2;
  cyl(pearl, 'ring_pillar_' + i, 1.2, 1.4, 9, M.concrete, Math.cos(ra) * 34, 4.5, Math.sin(ra) * 34, 10);
}

// ---------- twisting supertall ----------
const twistG = new THREE.Group(); twistG.name = 'twist_tower'; twistG.position.set(90, 0, 40); city.add(twistG);
const TW = { h: 560, n: 40 };
for (let i = 0; i < TW.n; i++) {
  const f = i / TW.n, w = 62 * (1 - f * 0.55);
  const seg = box(twistG, 'twist_seg_' + i, w, TW.h / TW.n, w * 0.78, M.glass_teal, 0, (i + 0.5) * (TW.h / TW.n), 0, f * 2.1);
  if (i % 4 === 2) seg.material = M.window_cool;
}
// Shanghai-Tower-style crown: the facade shears off in a diagonal cut, no spire
const tcS = new THREE.Shape();
tcS.moveTo(-14, 0); tcS.lineTo(14, 0); tcS.lineTo(14, 4); tcS.lineTo(-14, 26); tcS.closePath();
const tcG = new THREE.ExtrudeGeometry(tcS, { depth: 20, bevelEnabled: false });
tcG.translate(0, 0, -10);
const tCrown = new THREE.Mesh(tcG, M.glass_teal);
tCrown.name = 'twist_crown'; tCrown.rotation.y = 2.05; tCrown.position.set(0, TW.h, 0); twistG.add(tCrown);
const tFin = box(twistG, 'twist_fin', 2.2, 10, 16, M.steel, -12.8 * Math.cos(2.05), TW.h + 27, 12.8 * Math.sin(2.05), 2.05);
beacon(twistG, -12.8 * Math.cos(2.05), TW.h + 34, 12.8 * Math.sin(2.05));

// ---------- tapered blade with aperture crown ----------
const bladeG = new THREE.Group(); bladeG.name = 'blade_tower'; bladeG.position.set(150, 0, -30); bladeG.rotation.y = 0.35; city.add(bladeG);
const shape = new THREE.Shape();
shape.moveTo(-45, 0); shape.lineTo(45, 0); shape.lineTo(27, 400); shape.lineTo(-27, 400); shape.closePath();
const bladeBody = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 32, bevelEnabled: false }), M.glass_dark);
bladeBody.name = 'blade_body'; bladeBody.position.z = -16; bladeG.add(bladeBody);
for (const mx of [-13, 0, 13]) {
  box(bladeG, 'blade_mullion_f' + mx, 1.6, 382, 1.2, M.steel, mx, 193, 16.2);
  box(bladeG, 'blade_mullion_b' + mx, 1.6, 382, 1.2, M.steel, mx, 193, -16.2);
}
for (let y = 20; y < 386; y += 9.2) {
  const hw = 45 - 18 * y / 400 - 4, nxb = Math.max(2, Math.floor(hw * 2 / 5.6));

function loopPos(R1, R2, pA, pB, u) { // circuit: out along arc R1, U-turn, back along R2

    const c = polarPos(Rm, psi), rx = Math.sin(psi), rz = -Math.cos(psi), tx = Math.cos(psi), tz = Math.sin(psi);
    return { x: c.x - sgn * h * Math.cos(al) * rx + sgn * h * Math.sin(al) * tx, z: c.z - sgn * h * Math.cos(al) * rz + sgn * h * Math.sin(al) * tz };
