// sky environment (gradient dome, sun, dark ground) shared by every reflective surface in the scene
{
  const W = 1024, H = 512, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const c = cv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, H);

const city = new THREE.Group();

function box(parent, name, w, h, d, m, x, y, z, ry = 0) {

function beacon(parent, x, y, z) {

}
// window batcher: thousands of individual panes merged into one mesh per material
const winBatch = { warm: [], cool: [], dark: [], bund: [] };
function addWin(key, w, h, d, x, y, z, ry, g) { winBatch[key].push({ w, h, d, x, y, z, ry: ry || 0, g }); }
function gridFaces(g, key0, w, d, h, o = {}) {
  const fp = o.fp ?? 7.5, y0 = o.y0 ?? 9, y1 = o.y1 ?? h - 5, px = o.px ?? 5.4;
  const pw = o.pw ?? 3.3, ph = o.ph ?? 3.2, pd = 0.5, out = o.out ?? 0.2;
  const rot = o.ry || 0, cr = Math.cos(rot), sr = Math.sin(rot);

  const pick = () => { const r = rand(); return r < pWarm ? 'warm' : r < pWarm + pCool ? 'cool' : key0; };

  for (let y = y0; y < y1; y += fp) {
    const nx = Math.max(1, Math.floor((w - 3) / px)), nz = Math.max(1, Math.floor((d - 3) / px));

      const x = (k - (nx - 1) / 2) * px;

    }
    if (o.sides === false) continue;

}

const XC = -30, ZC = 385, RIV_IN = 535, RIV_OUT = 665;
const zArc = (R, x) => ZC - Math.sqrt(R * R - (x - XC) * (x - XC));
const polarPos = (R, psi) => ({ x: XC + R * Math.sin(psi), z: ZC - R * Math.cos(psi) });
const psiAt = (R, x) => Math.asin((x - XC) / R);
function arcBand(name, R0, R1, m, depth, y, x0 = -370, x1 = 370) {

function sample(arr, t) {

const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };

const timeEl = document.getElementById('time'), clockEl = document.getElementById('clock'), phaseEl = document.getElementById('phase');

function applyTime(t) {
  const top = sample(stops.top, t), mid = sample(stops.mid, t), hor = sample(stops.hor, t), hor2 = sample(stops.hor2, t);
  stage.style.setProperty('--stage-bg', `linear-gradient(180deg, ${hx(top)} 0%, ${hx(mid)} 40%, ${hx(hor)} 70%, ${hx(hor2)} 100%)`);

  hemi.intensity = 1.0 - 0.5 * smooth(0.3, 0.9, t);
  scene.environmentIntensity = 0.55 * (1 - 0.86 * smooth(0.4, 0.85, t));
  cloudMat.color.copy(sample(stops.cloud, t)); cloudMat.opacity = 0.92 - 0.42 * smooth(0.5, 0.9, t);

  M.twist_shell.opacity = 0.64 - 0.18 * glow;

  M.twist_shell.emissiveIntensity = 0.38 * glow;
  trafficLevel = (0.32 + 0.68 * Math.exp(-Math.pow((t - 0.6) / 0.14, 2))) * (1 - 0.75 * smooth(0.84, 0.98, t));
  M.head_glow.emissiveIntensity = 3.2 * glow;
  M.tail_glow.emissiveIntensity = (1.6 + 1.5 * trafficLevel) * glow;
  M.lane_paint.emissiveIntensity = 0.28 * glow;
  M.lane_yellow.emissiveIntensity = 0.22 * glow;
  M.window_warm.emissiveIntensity = 2.3 * glow;
  M.window_cool.emissiveIntensity = 1.7 * glow;
  M.glass_blue.emissiveIntensity = 0.34 * glow; M.glass_teal.emissiveIntensity = 0.3 * glow;
  M.glass_dark.emissiveIntensity = 0.38 * glow; M.glass_champagne.emissiveIntensity = 0.3 * glow;
  M.swfc_glass.emissiveIntensity = 0.28 * glow; M.swfc_glass.envMapIntensity = 1.0 - 0.72 * glow;
  M.swfc_mullion.emissiveIntensity = 0.3 * glow; M.swfc_white.emissiveIntensity = 1.2 * glow;

  M.bund_dome.emissiveIntensity = 0.45 * glow;
  M.bund_tile.emissiveIntensity = 0.55 * glow;
  M.paving.emissiveIntensity = 0.25 * glow;
  M.bund_window.emissiveIntensity = 1.0 * glow;
  M.clock_face.emissiveIntensity = 1.2 * glow;
  M.beacon_red.emissiveIntensity = 0.3 + 3 * glow;
  M.lamp_globe.emissiveIntensity = 1.6 * glow;
  M.sky_led.emissiveIntensity = 2.2 * glow;
  M.led_screen.emissiveIntensity = 0.04 + 2.2 * glow;
  M.crown_gold.emissiveIntensity = 1.4 * glow;
  M.bridge_steel.emissiveIntensity = 0.75 * glow;
  M.trim_gold.emissiveIntensity = 1.35 * glow;
  M.jinmao_glass.emissiveIntensity = 0.75 * glow;
  M.jinmao_alu.emissiveIntensity = 0.35 * glow;
  M.jinmao_skin.emissiveIntensity = 1.05 * glow; M.jinmao_skin.envMapIntensity = 0.7 - 0.45 * glow;
  M.jinmao_eave.emissiveIntensity = 1.25 * glow;
  M.jinmao_crown.emissiveIntensity = 1.9 * glow;
  M.globe_glass.emissiveIntensity = 1.15 * glow;
  M.flood_lens.emissiveIntensity = 2.6 * glow;
  ledMat.emissiveIntensity = 0.15 + 2.3 * glow;
  heartMat.opacity = 0.92 * glow;

  spots.forEach((s) => { s.intensity = 210 * glow; });
  streakMats.forEach((m2, i) => { m2.userData.base = (0.3 + (i % 3) * 0.06) * smooth(0.55, 0.88, t); });
  M.water.color.copy(waterDay.clone().lerp(waterNight, smooth(0.35, 0.9, t)));
  M.water.emissive.copy(glintDay.clone().lerp(glintNight, smooth(0.6, 0.9, t)));
  M.water.emissiveIntensity = 0.5 * smooth(0.35, 0.65, t);
  starMat.opacity = 0.55 * smooth(0.74, 0.96, t);

  const mins = Math.round((12 + 10.5 * t) * 60);
  clockEl.textContent = String(Math.floor(mins / 60)).padStart(2, '0') + ':' + String(mins % 60).padStart(2, '0');
  const hrA = ((12 + 10.5 * t) % 12) / 12 * Math.PI * 2, mnA = (((12 + 10.5 * t) * 60) % 60) / 60 * Math.PI * 2;

  chips.forEach((c) => c.classList.toggle('on', Math.abs(parseFloat(c.dataset.t) - t) < 0.045));

let raf = null;

chips.forEach((c) => c.addEventListener('click', () => {
  stopAnim();
  const from = parseFloat(timeEl.value), to = parseFloat(c.dataset.t), t0 = performance.now();
