<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Wenda Wang</title>
  <meta name="color-scheme" content="light dark">
  <style>
    :root { --bg:#f5f2ec; --ink:#2a2724; --ink-3:#8f8880; --accent:#7c8c79; }
    @media (prefers-color-scheme: dark) { :root { --bg:#1b1a18; --ink:#e9e3d9; --ink-3:#807a71; --accent:#9daa99; } }
    html { background:var(--bg); color:var(--ink); font-family:"Newsreader","Iowan Old Style",Georgia,serif; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem; }
    main { max-width:30rem; }
    h1 { font-weight:400; font-size:2.5rem; margin:0 0 .75rem; letter-spacing:-.01em; }
    p { color:var(--ink-3); margin:0 0 1.25rem; }
    a { color:var(--ink); text-decoration-color:var(--accent); text-underline-offset:.18em; }
  </style>
</head>
<body>
  <main>
    <h1>Nothing here.</h1>
